version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dispenco_postgres
    environment:
      POSTGRES_USER: dispenco_user
      POSTGRES_PASSWORD: dispenco_password
      POSTGRES_DB: dispenco_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispenco_user -d dispenco_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dispenco_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: dispenco_meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dispenco_master_key_must_be_at_least_16_bytes
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/data.ms
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meili_data:
    driver: local
