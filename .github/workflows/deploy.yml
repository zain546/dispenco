name: Continuous Deployment (CD)

on:
  push:
    branches: [main]

jobs:
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client Types
        run: pnpm --filter @dispenco/api exec prisma generate

      - name: Typecheck Workspace
        run: pnpm run typecheck

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Deploy via SSH to Docker Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "==> Navigating to project directory..."
            cd ${{ secrets.VPS_DEPLOY_DIR || '/home/ubuntu/dispenco' }}

            DOCKER="docker"
            if ! docker info >/dev/null 2>&1; then
              DOCKER="sudo docker"
            fi

            echo "==> Fetching latest changes from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Rebuilding API container..."
            $DOCKER compose -f docker-compose.prod.yml build --pull api

            echo "==> Starting updated API container..."
            $DOCKER compose -f docker-compose.prod.yml up -d --no-deps api

            echo "==> Running Prisma database migrations..."
            $DOCKER compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy

            echo "==> Pruning dangling Docker images to preserve disk space..."
            $DOCKER image prune -f

            echo "==> Checking API container status..."
            $DOCKER compose -f docker-compose.prod.yml ps api

            echo "✅ Deployment completed successfully!"
